name: Focused proposal
description: Explain a concrete use case and how it fits the package's core scope.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and current workaround
      description: Describe the application need and the behavior you cannot express today.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and compatibility
      description: Include an example and any Shopify core reference. Explain whether this belongs in Liquid or a host integration.
    validations:
      required: true
