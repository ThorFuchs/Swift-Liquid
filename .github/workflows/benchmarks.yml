name: Controlled benchmarks
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit selected by the separate timing commission
        required: true
        type: string
      commission_record:
        description: Retained maintainer timing commission identity
        required: true
        type: string
      confirmation:
        description: Dispatch does not itself approve timing or performance
        required: true
        type: choice
        default: Not commissioned
        options: [Not commissioned, Separate timing commission approved]
permissions:
  contents: read
concurrency:
  group: liquid-controlled-benchmarks
  cancel-in-progress: false
jobs:
  benchmarks:
    name: Explicit controlled measurements
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Bind commissioned source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          COMMISSION_RECORD: ${{ inputs.commission_record }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 -B Scripts/benchmark_request.py
      - name: Prepare immutable baseline
        run: git fetch --no-tags --depth 1 origin 9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e
      - name: Measure candidate
        run: env -u LIQUID_SWIFTPM_FLAGS python3 -B Scripts/ci.py --lane performance
      - name: Measure matched comparison
        run: env -u LIQUID_SWIFTPM_FLAGS python3 -B Scripts/ci.py --lane matched-performance
      - name: Retain every measurement
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-controlled-benchmarks
          path: |
            Artifacts/benchmark-request.json
            Artifacts/performance/
            Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
