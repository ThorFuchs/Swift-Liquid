name: Swift-Liquid attached date tracing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Recover exact binaries and all original observations
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: liquid-date-trace-study
          run-id: 38889400923
          github-token: ${{ github.token }}
          path: Artifacts/matched-performance/
      - name: Fetch immutable source versions
        run: |
          git fetch --no-tags --depth 1 origin 9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e
          git fetch --no-tags --depth 1 origin 1313f82ac03b6f51224d6c4219fc26ad0a598ddf
      - name: Verify attached capture and build coordinated consumers
        run: python3 -B Scripts/attached_date_traces.py setup
      - name: Record bounded executor events without repeating benchmarks
        run: python3 -B Scripts/attached_date_traces.py executor
      - name: Record attached CPU stacks with watchdogs
        run: python3 -B Scripts/attached_date_traces.py cpu
      - name: Qualify complete recovery cohort
        run: python3 -B Scripts/attached_date_traces.py finish
      - name: Retain all observations and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-date-trace-attached
          path: Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
