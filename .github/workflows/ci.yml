name: Swift-Liquid CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Swift 6.4 / ${{ matrix.lane }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [native, safety, docs, reference, platforms, installation]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Ruby reference runtime
        if: matrix.lane == 'reference'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '4.0.1'
      - name: Prepare pinned reference
        if: matrix.lane == 'reference'
        env:
          LIQUID_REFERENCE_PATH: ${{ runner.temp }}/shopify-liquid
        run: |
          gem install date --version 3.5.1 --no-document
          gem install time --version 0.4.2 --no-document
          git init "$LIQUID_REFERENCE_PATH"
          git -C "$LIQUID_REFERENCE_PATH" remote add origin https://github.com/Shopify/liquid.git
          git -C "$LIQUID_REFERENCE_PATH" fetch --depth 1 origin 4e39ae4cc3da73921923c0669e0fc84a66b2f696
          git -C "$LIQUID_REFERENCE_PATH" checkout --detach FETCH_HEAD
      - name: Qualify
        if: matrix.lane != 'reference' && matrix.lane != 'docs'
        run: env LIQUID_SWIFTPM_FLAGS='--jobs 2' python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'
      - name: Qualify documentation
        if: matrix.lane == 'docs'
        run: env -u LIQUID_SWIFTPM_FLAGS python3 -B Scripts/ci.py --lane docs
      - name: Qualify reference behavior
        if: matrix.lane == 'reference'
        env:
          LIQUID_REFERENCE_PATH: ${{ runner.temp }}/shopify-liquid
          LIQUID_SWIFTPM_FLAGS: --jobs 2
        run: python3 -B Scripts/ci.py --lane reference --reference-path "$LIQUID_REFERENCE_PATH"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: liquid-${{ matrix.lane }}
          path: |
            Artifacts/${{ matrix.lane }}/
            !Artifacts/docs/Liquid.doccarchive/**
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: ${{ matrix.lane == 'docs' }}
  archive:
    name: Qualify clean source archive
    needs: qualify
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      LIQUID_SWIFTPM_FLAGS: --jobs 2
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 (Node 24)
        with:
          name: liquid-docs
          path: Artifacts/docs
      - run: python3 -B Scripts/ci.py --lane archive
      - name: Retain correctness archive assets
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-archive
          path: Artifacts/archive/
          if-no-files-found: error
          retention-days: 30
  correctness:
    name: Repository correctness
    needs: [qualify, archive]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - name: Admit every required result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          if set(needs) != {'qualify', 'archive'} or any(
              needs[name].get('result') != 'success' for name in needs
          ):
              raise SystemExit('Every required lane and clean archive must succeed')
          print('Repository correctness passed')
          PY
