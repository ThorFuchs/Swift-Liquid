name: Swift-Liquid published installation verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    name: Fresh public Swift-Liquid 1.3.1 installation
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: test "$RUNNER_ENVIRONMENT" = "github-hosted"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1.3.1
          persist-credentials: false
      - name: Verify immutable published version through fresh public URLs
        run: |
          python3 -B - <<'PYTHON'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          expected='fb81cf4ff01f1bf098ceb5fff65638b1271294e0'
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert commit==expected
          assert not subprocess.check_output(['git','status','--porcelain'],text=True)
          source=root/'Scripts/check_installation.py'
          original=source.read_text()
          assert original.count("VERSION = '1.3.0'")==1
          assert original.count("REVISION = '9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e'")==1
          driver=Path(os.environ['RUNNER_TEMP'])/'verify-published-1.3.1.py'
          driver.write_text(original.replace("VERSION = '1.3.0'","VERSION = '1.3.1'").replace("REVISION = '9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e'",f"REVISION = '{expected}'"))
          env=os.environ.copy();env['PYTHONPATH']=str(root/'Scripts')
          result=subprocess.run([sys.executable,'-B',str(driver)],env=env)
          output=root/'Artifacts/installation';output.mkdir(parents=True,exist_ok=True)
          provenance={'schemaVersion':1,'checkedOutPublicTag':'1.3.1','sourceCommit':commit,'workflowCommit':os.environ['GITHUB_SHA'],'runnerEnvironment':'github-hosted','referenceDriverSHA256':hashlib.sha256(source.read_bytes()).hexdigest(),'adaptedDriverSHA256':hashlib.sha256(driver.read_bytes()).hexdigest(),'runURL':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'exitCode':result.returncode}
          (output/'provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          (output/'adapted-driver.py').write_bytes(driver.read_bytes())
          sys.exit(result.returncode)
          PYTHON
      - name: Retain published-installation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-published-installation-1.3.1
          path: Artifacts/installation/
          if-no-files-found: error
          retention-days: 30
