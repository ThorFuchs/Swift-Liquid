name: Swift-Liquid caller and date investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    name: Frozen caller and date hypotheses with identical-source controls
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch immutable sources and harness
        run: |
          git fetch --no-tags --depth 1 origin 9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e
          git fetch --no-tags --depth 1 origin fb81cf4ff01f1bf098ceb5fff65638b1271294e0
          git fetch --no-tags --depth 1 origin e29ec2a639b8d73a1c885b541f1bcef408c9c2a7
          git fetch --no-tags --depth 1 origin 5d1223608cd1b31e185acce76d3d659a316bb038
      - name: Run the frozen study
        run: python3 -B Scripts/hosted_caller_date_study.py
      - name: Retain every observation, qualification and patch
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-caller-date-investigation
          path: Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
