name: Swift-Liquid recognition cost study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch immutable library versions
        run: |
          git fetch --no-tags --depth 1 origin 9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e
          git fetch --no-tags --depth 1 origin 1ae8df16c6cc02caba75f83d6a46ea52f74a7d56
      - name: Qualify sources and build all nine binaries
        run: python3 -B Scripts/hosted_recognition_study.py setup
      - name: Record all counterbalanced observations
        run: python3 -B Scripts/hosted_recognition_study.py measure
      - name: Admit complete measurements and flags
        run: python3 -B Scripts/hosted_recognition_study.py summary
      - name: Retain every observation and failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-date-recognition-study
          path: Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
