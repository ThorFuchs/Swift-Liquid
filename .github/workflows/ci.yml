name: Normalization and matching study
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-optimization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    name: Frozen normalization and matching candidates
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require GitHub-hosted isolation
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
          echo "LIQUID_REFERENCE_PATH=$RUNNER_TEMP/shopify-liquid" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '4.0.1'
      - name: Prepare pinned reference
        run: |
          gem install date --version 3.5.1 --no-document
          gem install time --version 0.4.2 --no-document
          git init "$LIQUID_REFERENCE_PATH"
          git -C "$LIQUID_REFERENCE_PATH" remote add origin https://github.com/Shopify/liquid.git
          git -C "$LIQUID_REFERENCE_PATH" fetch --depth 1 origin 4e39ae4cc3da73921923c0669e0fc84a66b2f696
          git -C "$LIQUID_REFERENCE_PATH" checkout --detach FETCH_HEAD
      - name: Build and semantically qualify all candidates before timing
        run: python3 -B Scripts/hosted_optimization_study.py setup
      - name: Run frozen serial ABBA comparisons
        run: python3 -B Scripts/hosted_optimization_study.py measure
      - name: Summarize every comparison and flag
        run: python3 -B Scripts/hosted_optimization_study.py summary
      - name: Retain every attempted observation
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-normalization-matching-study
          path: Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
