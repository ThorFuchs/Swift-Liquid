name: Swift-Liquid recurring date diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "LIQUID_RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch immutable library versions
        run: |
          git fetch --no-tags --depth 1 origin 9963591f18ef8aa1d1a8d9cd9bcc5508c82b5d4e
          git fetch --no-tags --depth 1 origin e5291b040c046415f4b535903d23f56c49320c0e
      - name: Execute frozen wall and CPU study
        run: python3 -B Scripts/hosted_recurring_date_study.py
      - name: Retain all observations and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: liquid-recurring-date-study
          path: Artifacts/matched-performance/
          if-no-files-found: error
          retention-days: 30
