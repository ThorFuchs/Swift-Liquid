name: Swift-Liquid CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liquid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Swift 6.4 / ${{ matrix.lane }}
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [native, safety, docs, performance]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, sibling blueprint
        with:
          persist-credentials: false
      - run: python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, sibling blueprint
        with:
          name: liquid-${{ matrix.lane }}
          path: Artifacts/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 30
      - name: Package documentation site
        if: matrix.lane == 'docs'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5, sibling blueprint
        with:
          path: Artifacts/docs/Liquid.doccarchive/
          include-hidden-files: true
  publish-docs:
    name: Publish qualified documentation
    needs: qualify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6, sibling blueprint
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, sibling blueprint
